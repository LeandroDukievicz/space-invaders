<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d16" />
    <meta name="description" content="Jogue Space Invaders no navegador, com teclado ou controles de toque." />
    <title>Space Invaders</title>
    <link rel="stylesheet" href="style.css" />
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="game-shell" aria-label="Jogo Space Invaders">
      <header class="game-header">
        <h1>SPACE <span>INVADERS</span></h1>
        <div class="game-actions">
          <button id="sound-button" class="icon-button" type="button" aria-label="Ativar som" aria-pressed="false" title="Ativar som">
            <span aria-hidden="true">♪</span> SOM <span id="sound-state">OFF</span>
          </button>
          <button id="pause-button" class="icon-button pause-button" type="button" aria-label="Pausar jogo" title="Pausar jogo" disabled><span aria-hidden="true">Ⅱ</span></button>
        </div>
      </header>

      <section class="game-frame" aria-label="Área do jogo">
        <div class="scoreboard" aria-label="Placar">
          <div><span class="stat-label">PONTOS</span><strong id="score">000000</strong></div>
          <div><span class="stat-label">RECORDE</span><strong id="high-score">000000</strong></div>
          <div><span class="stat-label">ONDA</span><strong id="wave">01</strong></div>
          <div><span class="stat-label">VIDAS</span><strong id="lives" class="lives" aria-label="3 vidas">♥ ♥ ♥</strong></div>
        </div>

        <div class="screen-wrap">
          <canvas id="game" width="960" height="640" aria-label="Campo de batalha do Space Invaders"></canvas>
          <div class="game-overlay" id="overlay">
            <p class="overlay-kicker" id="overlay-kicker">PREPARE-SE</p>
            <h2 id="overlay-title">SPACE<br /><span>INVADERS</span></h2>
            <p id="overlay-description">Defenda a Terra dos invasores.</p>
            <button class="start-button" id="start-button" type="button"><span id="start-label">INICIAR JOGO</span></button>
            <p class="overlay-hint" id="overlay-hint">OU PRESSIONE ENTER</p>
          </div>
          <div id="announcement" class="sr-only" aria-live="polite" aria-atomic="true"></div>
        </div>
      </section>

      <div class="touch-controls" aria-label="Controles de toque">
        <div class="touch-movement">
          <button type="button" class="touch-button" data-control="left" aria-label="Mover para a esquerda">←</button>
          <button type="button" class="touch-button" data-control="right" aria-label="Mover para a direita">→</button>
        </div>
        <button type="button" class="touch-button touch-fire" data-control="fire" aria-label="Atirar">ATIRAR</button>
      </div>

      <section class="controls" aria-label="Comandos">
        <div><span class="keys"><kbd>←</kbd><kbd>→</kbd> <span>ou</span> <kbd>A</kbd><kbd>D</kbd></span><span>Mover</span></div>
        <div><span class="keys"><kbd>ESPAÇO</kbd></span><span>Atirar</span></div>
        <div><span class="keys"><kbd>P</kbd> <span>ou</span> <kbd>ESC</kbd></span><span>Pausar</span></div>
      </section>
    </main>
  </body>
</html>
